# =============================================================
# Nextcloud AIO - Local Instance Docker Compose
# =============================================================
# Usage:
#   1. Copy .env.local to .env and fill in all TODO fields
#   2. Run: docker compose -f compose.local.yaml up -d
# =============================================================

name: nextcloud-aio

services:

  # ----------------------------------------------------------
  # Caddy reverse proxy — handles HTTPS for local domain
  # Serves Nextcloud on https://nextcloud.local (or your domain)
  # ----------------------------------------------------------
  caddy:
    image: caddy:alpine
    restart: unless-stopped
    container_name: nextcloud-aio-caddy
    network_mode: host
    volumes:
      - caddy_certs:/certs
      - caddy_config:/config
      - caddy_data:/data
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - nextcloud-aio-mastercontainer

  # ----------------------------------------------------------
  # AIO Mastercontainer — manages all Nextcloud sub-containers
  # ----------------------------------------------------------
  nextcloud-aio-mastercontainer:
    image: ghcr.io/nextcloud-releases/all-in-one:latest
    init: true
    restart: always
    container_name: nextcloud-aio-mastercontainer
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: bridge
    ports:
      - 8080:8080    # AIO web interface (https://localhost:8080)
    environment:
      # Bind Apache to localhost so only Caddy can reach it
      APACHE_PORT: 11000
      APACHE_IP_BINDING: 127.0.0.1
      # Skip domain validation for local/LAN domains
      SKIP_DOMAIN_VALIDATION: true

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer
  caddy_certs:
  caddy_config:
  caddy_data:
